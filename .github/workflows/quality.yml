name: quality

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (tag in the trailing comment) so a moved
# tag cannot change what runs in CI. Dependabot proposes reviewed SHA bumps.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install (frozen lockfile)
        # --frozen fails instead of re-resolving, so CI tests exactly the reviewed uv.lock.
        run: uv sync --frozen --extra dev --python 3.12
      - name: Ruff
        run: uv run --frozen ruff check .
      - name: Mypy
        run: uv run --frozen mypy src
      - name: Build execution image
        run: docker build -t agentic-analytics-exec:test -f docker/Dockerfile.exec .
      - name: Scan execution image (OS packages and installed Python libraries)
        # Severity policy: report HIGH and CRITICAL; fail the build on any CRITICAL finding
        # that has a fixed version available. Trivy runs from an image pinned by digest.
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          scan() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" image --quiet --scanners vuln --ignore-unfixed "$@" \
              agentic-analytics-exec:test
          }
          scan --severity HIGH,CRITICAL --exit-code 0 --format table
          scan --severity CRITICAL --exit-code 1 --skip-db-update --format table
      - name: Tests
        run: uv run --frozen pytest --cov=agentic_analytics --cov-report=term-missing

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
      - name: Verify lockfile matches pyproject
        run: uv lock --check
      - name: Dependency vulnerability scan (locked runtime + dev dependencies)
        run: |
          uv export --frozen --extra dev --no-emit-project --no-hashes \
            --format requirements-txt -o requirements.lock.txt
          uvx pip-audit==2.10.1 -r requirements.lock.txt --disable-pip --no-deps --strict
      - name: Generate SBOM
        run: uv export --frozen --format cyclonedx1.5 -o sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json
