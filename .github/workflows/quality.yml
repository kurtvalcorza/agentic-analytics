name: quality

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (tag in the trailing comment) so a moved
# tag cannot change what runs in CI. Dependabot proposes reviewed SHA bumps.
jobs:
  tests:
    # Every supported Python: the oldest (requires-python) and the newest. The execution image
    # pins its own Python in docker/Dockerfile.exec; this matrix covers the server side.
    name: tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install (frozen lockfile)
        # --frozen fails instead of re-resolving, so CI tests exactly the reviewed uv.lock.
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Ruff
        run: uv run --frozen ruff check .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Mypy
        # Check against the interpreter under test, not only the configured floor.
        run: uv run --frozen mypy --python-version ${{ matrix.python }} src
      - name: Build execution image
        run: docker build -t agentic-analytics-exec:test -f docker/Dockerfile.exec .
      - name: Scan execution image (OS packages and installed Python libraries)
        # The image is identical on every matrix leg, so it is scanned once.
        if: matrix.python == '3.12'
        # Severity policy: report HIGH and CRITICAL; fail the build on any CRITICAL finding
        # that has a fixed version available. Trivy runs from an image pinned by digest.
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          scan() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" image --quiet --scanners vuln --ignore-unfixed "$@" \
              agentic-analytics-exec:test
          }
          scan --severity HIGH,CRITICAL --exit-code 0 --format table
          scan --severity CRITICAL --exit-code 1 --skip-db-update --format table
      - name: Tests
        env:
          # Fail instead of skipping every test if this runner has no Landlock.
          AGENTIC_ANALYTICS_TEST_REQUIRE_SANDBOX: "1"
          # Fail instead of skipping the Docker tests if the image built above is missing.
          AGENTIC_ANALYTICS_TEST_REQUIRE_DOCKER: "1"
        run: >-
          uv run --frozen pytest --cov=agentic_analytics --cov-report=term-missing
          --cov-fail-under=85

  quality:
    # The required status check for main. It passes only when every matrix leg of `tests`
    # passed, so adding or removing a Python version does not change the ruleset.
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Every Python version passed
        env:
          RESULT: ${{ needs.tests.result }}
        run: test "$RESULT" = success

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32"
      - name: Verify lockfile matches pyproject
        run: uv lock --check
      - name: Dependency vulnerability scan (locked runtime, dev and exec-image dependencies)
        run: |
          uv export --frozen --extra dev --group exec --no-emit-project --no-hashes \
            --format requirements-txt -o requirements.lock.txt
          uvx pip-audit==2.10.1 -r requirements.lock.txt --disable-pip --no-deps --strict
      - name: Generate SBOM
        run: uv export --frozen --all-groups --format cyclonedx1.5 -o sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
